<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Abriendo WhatsApp · HOUP</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0E0E0E;color:#EDEDED;font-family:Montserrat,-apple-system,"Segoe UI",Arial,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
    h1{font-size:1.4rem;margin:0 0 .6rem}
    p{color:#B5B5B5;margin:0 0 1.4rem;line-height:1.5}
    a.b{display:inline-block;background:#02C1F4;color:#0E0E0E;text-decoration:none;font-weight:600;padding:14px 26px;border-radius:999px}
  </style>
</head>
<body>
  <main>
    <h1>Abriendo WhatsApp…</h1>
    <p id="t">Si no se abre en unos segundos, use el botón.</p>
    <a class="b" id="b" href="https://wa.me/528183621791">Abrir WhatsApp →</a>
  </main>
  <script>
  (function(){
    var q=new URLSearchParams(location.search), e=(q.get('e')||'').toLowerCase(), m=q.get('m')||'';
    // Mensajes fijos: esta página solo abre WhatsApp con textos de HOUP.
    var M={
      dx:"Hola HOUP Empresas, recibí mi diagnóstico de las 4 C's y me gustaría platicar.",
      comp:"Hola HOUP Empresas, ya tengo la comparación de las 4 C's con mi equipo y me gustaría platicar.",
      guia:"Hola HOUP Educación, descargué la guía de bienestar socioemocional y me gustaría platicar.",
      reporte:"Hola HOUP Fundación, descargué el reporte de impacto y me gustaría platicar."
    };
    var url='https://wa.me/528183621791';
    if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(e)){
      url='https://wa.me/?text='+encodeURIComponent('Equipo: respondí un diagnóstico breve de HOUP sobre cómo trabajamos y quiero conocer cómo lo ven ustedes. Son 12 afirmaciones, toma 3 minutos y es anónimo. https://houp.mx/diagnostico-4c.html?e='+e);
      document.getElementById('t').textContent='Elija el grupo o las personas de su equipo y envíe el mensaje.';
    } else if(M[m]) url+='?text='+encodeURIComponent(M[m]);
    document.getElementById('b').href=url;
    location.replace(url);
  })();
  </script>
</body>
</html>
